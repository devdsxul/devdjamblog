<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Neocities Astro Celestial Dotted Grid -->
  <path d="M0 0h200M0 100h200M0 0v200M100 0v200" stroke="#000000" stroke-opacity="0.03" stroke-width="1" stroke-dasharray="1 7"/>
  <path d="M98 100h5M100 98v5M-2 100h5M0 98v5M198 100h5M200 98v5M98 0h5M100 -2v5M98 200h5M100 198v5" stroke="#94a3b8" stroke-width="0.8" stroke-opacity="0.25"/>

  <!-- Faint Constellation Dotted Link -->
  <line x1="136" y1="19" x2="156" y2="42" stroke="#94a3b8" stroke-width="0.75" stroke-dasharray="2 3" stroke-opacity="0.3"/>

  <!-- Tiny Crescent Moon Accent -->
  <circle cx="182" cy="30" r="3.2" fill="#facc15" opacity="0.45"/>
