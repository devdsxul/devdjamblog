  <path d="M110 50h1v5h-1zM110 50h1v5h-1zM108 52h5v1h-5z" fill="#facc15" opacity="0.65"/>
  <rect x="110" y="52" width="1" height="1" fill="#ffffff"/>

  <path d="M22 173h1v5h-1zM20 175h5v1h-5z" fill="#c084fc" opacity="0.55"/>
