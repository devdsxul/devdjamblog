  <!-- Crisp 1px & 2px Neutral Pixel Stardust -->
  <rect x="18" y="24" width="1" height="1" fill="#64748b" opacity="0.35"/>
  <rect x="135" y="18" width="2" height="2" fill="#64748b" opacity="0.25"/>
  <rect x="82" y="74" width="1" height="1" fill="#64748b" opacity="0.3"/>
  <rect x="175" y="92" width="1" height="1" fill="#64748b" opacity="0.35"/>
  <rect x="42" y="145" width="1" height="1" fill="#64748b" opacity="0.3"/>
  <rect x="148" y="172" width="2" height="2" fill="#64748b" opacity="0.25"/>
  <rect x="105" y="132" width="1" height="1" fill="#64748b" opacity="0.25"/>
  <rect x="12" y="185" width="1" height="1" fill="#64748b" opacity="0.3"/>

  <!-- Pastel Pink Stardust (DEVDJAM Accent) -->
  <rect x="48" y="58" width="2" height="2" fill="#ec4899" opacity="0.4"/>
  <rect x="156" y="42" width="1" height="1" fill="#ec4899" opacity="0.45"/>
  <rect x="72" y="162" width="2" height="2" fill="#ec4899" opacity="0.4"/>

  <!-- Pastel Cyan Stardust -->
  <rect x="94" y="32" width="2" height="2" fill="#0284c7" opacity="0.35"/>
  <rect x="28" y="108" width="1" height="1" fill="#0284c7" opacity="0.4"/>
  <rect x="182" y="138" width="2" height="2" fill="#0284c7" opacity="0.35"/>

  <!-- Pale Gold Stardust -->
  <rect x="145" y="104" width="1" height="1" fill="#ca8a04" opacity="0.45"/>
  <rect x="62" y="16" width="1" height="1" fill="#ca8a04" opacity="0.4"/>
  <rect x="116" y="180" width="1" height="1" fill="#ca8a04" opacity="0.4"/>

  <!-- Lavender Stardust -->
  <rect x="35" y="78" width="1" height="1" fill="#9333ea" opacity="0.35"/>
